# SPDX-License-Identifier: Apache-2.0
# A MOOtation settings file. Load it from C++ with
#   mootation::Settings::from_file("run.cfg")
# or from any other language through the C ABI with
#   moo_open_file("run.cfg")
#
# One `key = value` per line. `#` and `;` start a comment. An unknown key is an
# error, not a silent no-op: a typo must not quietly give you a different run
# than you asked for.

# ── the run ─────────────────────────────────────────────────────────────────
algorithm   = nsga2        # any name from mootation::algorithm_names()
pop_size    = 100
max_gen     = 250
# max_evaluations = 25000  # instead of max_gen: stop once this many evaluations
                           # are spent (a step is not pop_size evaluations for
                           # every algorithm; compare budgets in evaluations)
seed        = 42

# ── the problem ─────────────────────────────────────────────────────────────
n_vars      = 10           # only needed while lower/upper are single values
n_objs      = 2
n_cons      = 0            # constraint values per candidate; 0 = unconstrained
lower       = 0            # one value broadcasts to all n_vars ...
upper       = 1
# lower     = 0, 0, -5     # ... or give one value per variable
constraints = none         # none | feasibility | cdp | eps_constraint

# ── warm start (optional) ───────────────────────────────────────────────────
# seed_population  = pop.csv   # a file written by io::save_population / moo_result
# on_size_mismatch = error     # error | truncate | pad  (file size vs pop_size)

# ── optional algorithm knobs ────────────────────────────────────────────────
# Anything left out keeps the algorithm's own published default. A knob the
# chosen algorithm does not have is reported (Result::ignored / moo_ignored_*)
# rather than dropped.
#
#   eta_c  eta_m  pc  pm  T  delta  nr  kappa  K  n_clusters  theta  alpha
#   F  CR  div  normalize (0/1: IBEA, R2-IBEA, Two_Arch2, MOEA/D-AM2M)
#
# eta_c     = 30
# theta     = 5
#
# The switchable operators of NSGA-II, IBEA-eps+, SPEA2+SDE, AGE-MOEA and
# SMS-EMOA (docs/embedding.md, Settings):
# crossover       = de          # sbx | uniform | blx_alpha | spx | rex | undx | pcx
#                               # | de | de_pbest | portfolio
# mutation        = none        # polynomial | gaussian | cauchy | uniform_reset
#                               # | mixture | mixture_cauchy | none
# F               = 0.5         # de, de_pbest
# CR              = 1           # de, de_pbest
# de_adapt        = shade       # none | shade
# de_adapt_weight = equal       # equal | contribution
# de_p            = 0.1         # de_pbest: the share of the best
# de_archive      = yes         # de_pbest: r2 from the population and the archive
# portfolio       = sbx, de, pcx, undx
# portfolio_credit = uniform    # uniform | borg
# survival        = greedy      # greedy | stochastic (sms_emoa, nsga2, nsga3)
# spu_frac        = 0.5         # |Q'| / |Q|: 1/2 in sms_emoa, 3/4 in nsga2, nsga3
# inner_archive   = off         # off | nd (sms_emoa, nsga2, nsga3, ibea_eplus)
# inner_archive_cap = 0         # unset: 10 mu (real genome); 0: no cap
# archive_reuse_p = 0           # a parent from the inner archive with this probability
# bin_crossover   = uniform     # uniform | none (sms_emoa, nsga2)
# mating          = tournament  # tournament | each (nsga2)
# coords          = axis        # axis | pca | pca_nd | randrot: the variation in
#                               # learned coordinates (also mosa's sbx step)
# coords_warmup   = 10          # generations with R = I
# coords_update   = 1           # generations between updates of R
# ref_delta       = 0.1         # sms_emoa, hype: r = nad + delta (nad - ideal)
#
# mosa (algorithms/mosa.hpp, docs/running.md):
# sa_energy       = cmb         # cmb | eps | dom | tch
# sa_step         = mix         # mix | laplace | de | sbx | adaptive
# p_de            = 0.7         # de: the differential step's probability
# sa_chains       = 1           # 10 with tch
# sa_reseed       = 0.02        # restart a chain from the archive
# sa_t_ratio      = 1e-4        # T at the last step / T_0
# sa_s0           = 0.2         # the Laplace scale over ub - lb, first
# sa_s_end        = 0.002       # ... and last
# sa_archive_cap  = 0           # 0: every non-dominated point
# sa_weights      = psa         # tch: psa | fixed
# sa_psa_alpha    = 1.05
# sa_tch_accept   = weighted_sum # tch: weighted_sum | chebyshev
# sa_adapt_window = 200         # adaptive: the credit window in steps
#
# smpso (algorithms/smpso.hpp, docs/running.md); each knob overrides its preset:
# smpso_preset    = jmetal      # jmetal | platemo | fair | omopso
# chi_mode        = signed      # signed | abs | none: chi as printed, its modulus, 1
# vmax_frac       = 0.5         # |v| <= vmax_frac (ub - lb); 0: no bound
# vel_on_bound_low = -1         # the velocity's factor at the lower bound
# vel_on_bound_up = -1          # ... and at the upper
# w_min           = 0.1         # the inertia weight, U[w_min, w_max]
# w_max           = 0.1
# c_min           = 1.5         # C1, C2 ~ U[c_min, c_max]
# c_max           = 2.5
# r_per_dim       = no          # no | yes: r1, r2 per particle or per variable
# turbulence      = every_k     # every_k | prob | thirds | off
# turbulence_k    = 6           # every_k: the particles i % k == 0
# turbulence_p    = 0.15        # prob: each particle with this probability
# archive_size    = 0           # unset: pop_size
# archive_prune   = one_by_one  # one_by_one | one_shot
# leader_select   = crowding_tournament # crowding_tournament | random
# leader_offer    = all         # all | improved: only particles that replaced their best
# eps_archive_eta = 0.0075      # omopso: the answer's epsilon archive
#
# r2_emoa (algorithms/r2_emoa.hpp):
# r2_mode         = exact       # exact | discrete
# r2_space        = weight      # weight | angle (discrete, two objectives)
# r2_weights      = 500
# r2_offset       = 0           # r* = z* - r2_offset (nadir - z*)
#
# bc_spx, bc_rex (algorithms/bc_spx.hpp, bc_rex.hpp):
# bc_selection    = bc          # bc | bf | ba
# bc_lambda       = 0           # children a step; 0: 10n
#
# paes (algorithms/paes.hpp):
# paes_depth      = 5           # the grid's halvings per objective
#
# dmulti_mads (algorithms/dmulti_mads.hpp):
# mads_tau        = 0.5         # a failure's frame factor
# mads_delta0     = 0.1         # the first frame, a share of the range
# mads_select     = spread      # spread | first
# mads_poll       = complete    # complete | opportunistic
# mads_search     = speculative # speculative | none
#
# multiglods (algorithms/multiglods.hpp):
# glods_search_every = 3        # failures in a row before a Sobol search
# glods_local_tol = 1e-3        # the step of a local point
#
# The scalarization methods (scalar, eps_sqp, ...) and the polishing (polish,
# polish_share, polish_points) are Python only (python/mootation/scalar): a
# core reports their knobs ignored.
