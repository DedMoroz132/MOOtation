# SPDX-License-Identifier: Apache-2.0
# A MOOtation settings file. Load it from C++ with
#   mootation::Settings::from_file("run.cfg")
# or from any other language through the C ABI with
#   moo_open_file("run.cfg")
#
# One `key = value` per line. `#` and `;` start a comment. An unknown key is an
# error, not a silent no-op: a typo must not quietly give you a different run
# than you asked for.

# ── the run ─────────────────────────────────────────────────────────────────
algorithm   = nsga2        # any name from mootation::algorithm_names()
pop_size    = 100
max_gen     = 250
seed        = 42

# ── the problem ─────────────────────────────────────────────────────────────
n_vars      = 10           # only needed while lower/upper are single values
n_objs      = 2
n_cons      = 0            # constraint values per candidate; 0 = unconstrained
lower       = 0            # one value broadcasts to all n_vars ...
upper       = 1
# lower     = 0, 0, -5     # ... or give one value per variable
constraints = none         # none | feasibility | cdp | eps_constraint

# ── optional algorithm knobs ────────────────────────────────────────────────
# Anything left out keeps the algorithm's own published default. A knob the
# chosen algorithm does not have is reported (Result::ignored / moo_ignored_*)
# rather than dropped.
#
#   eta_c  eta_m  pc  pm  T  delta  nr  kappa  K  n_clusters  theta  alpha
#   F  CR  div
#
# eta_c     = 30
# theta     = 5
