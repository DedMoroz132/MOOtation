# All 58 algorithms on a spread of problem shapes: which one is good where.
#
#   python -m mootation.run.campaign campaign_all.toml --list > jobs.txt   # 26 970 jobs
#   python -m mootation.run.campaign campaign_all.toml --workers 16        # one per core
#   python -m mootation.run.campaign campaign_all.toml --ranks igd         # the condensed answer
#   python -m mootation.run --tui campaign_all.toml                        # Campaign / Compare / Explore
#
# Split across machines: run `--shard i/n` on machine i (i = 0 .. n-1), then copy
# every machine's results/all58 into one tree; Compare, --compare and --ranks
# read whatever meta.json files are under it. A killed run resumes when started
# again. docs/running.md, "All 58 algorithms on another machine", has the recipe.
#
# ── What it costs ───────────────────────────────────────────────────────────
# Measured with one seed at 5 000 evaluations, six jobs at a time on an
# 8-thread desktop. The benchmark is evaluated in Python, which is most of the
# time for the cheaper algorithms.
#
#   all 58 on one 2-objective problem     23 s   (ZDT1)
#   all 58 on one 3-objective problem     92 s   (DTLZ2_3D; HypE 38 s of it)
#   all 58 on one 5-objective problem    545 s   (DTLZ2_5D; SMS-M2M 312 s,
#                                                 R2-IBEA 99 s, HypE 46 s)
#
# Time grows about in proportion to the budget. As shipped — 5 runs at 10 000
# evaluations — the whole campaign is about 80 CPU-hours: some 5 hours on 16
# cores, 10 on 8. SMS-M2M alone is about half of that, R2-IBEA a sixth and HypE
# an eighth; commenting out those three leaves about 18 CPU-hours. Two presets:
#
#   first look      runs = 5,  budget_fe = 10000   as shipped
#   paper budgets   runs = 21, budget_fe = 0       500 generations each; about
#                                                  2 000 CPU-hours, so shard it
#
# The 40 ZCAT problems added about 83% to what the campaign was, nearly all of
# it the twenty at five objectives, so commenting out the ZCAT*_5D block brings
# it back to about 48 CPU-hours. What did NOT matter is their evaluation: at
# about 3x DTLZ2's (measured, 71 us against 25 at three objectives and 92
# against 33 at five) it is still only 0.9 s of a 10 000-evaluation job.

# The list comes first because TOML allows top-level keys only before the first
# [table]. Comment a line out to drop an algorithm. pop = 0 and gens = 0 take
# each problem's own defaults, rounded to a size the algorithm accepts (the
# rounding is noted in each run's meta.json); parameters are the papers'.
algorithms = [
    # Pareto dominance and diversity
    { name = "nsga2",      pop = 0, gens = 0 },
    { name = "spea2",      pop = 0, gens = 0 },
    { name = "spea2_sde",  pop = 0, gens = 0 },
    { name = "grea",       pop = 0, gens = 0 },
    { name = "vaea",       pop = 0, gens = 0 },
    { name = "agemoea",    pop = 0, gens = 0 },
    { name = "etea",       pop = 0, gens = 0 },
    # Reference points (NSGA-III family)
    { name = "nsga3",      pop = 0, gens = 0 },
    { name = "a_nsga3",    pop = 0, gens = 0 },
    { name = "theta_dea",  pop = 0, gens = 0 },
    { name = "ar_moea",    pop = 0, gens = 0 },
    # Decomposition and region division (MOEA/D family)
    { name = "moead",      pop = 0, gens = 0 },
    { name = "moead_de",   pop = 0, gens = 0 },
    { name = "moead_dra",  pop = 0, gens = 0 },
    { name = "moead_dd",   pop = 0, gens = 0 },
    { name = "moead_awa",  pop = 0, gens = 0 },
    { name = "adaw",       pop = 0, gens = 0 },
    { name = "moead_m2m",  pop = 0, gens = 0 },
    { name = "moead_am2m", pop = 0, gens = 0 },
    { name = "sms_m2m",    pop = 0, gens = 0 },
    { name = "moead_ds",   pop = 0, gens = 0 },
    { name = "rd_emo",     pop = 0, gens = 0 },
    { name = "aprd",       pop = 0, gens = 0 },
    { name = "liu_gu2011", pop = 0, gens = 0 },
    { name = "isde_rd",    pop = 0, gens = 0 },
    { name = "dhea",       pop = 0, gens = 0 },
    { name = "hlmea",      pop = 0, gens = 0 },
    # Indicator-based
    { name = "ibea_eplus", pop = 0, gens = 0 },
    { name = "ibea_hd",    pop = 0, gens = 0 },
    { name = "mibea",      pop = 0, gens = 0 },
    { name = "r2ibea",     pop = 0, gens = 0 },
    { name = "hype",       pop = 0, gens = 0 },
    { name = "mombi2",     pop = 0, gens = 0 },
    { name = "nimmo",      pop = 0, gens = 0 },
    { name = "irea",       pop = 0, gens = 0 },
    { name = "edv",        pop = 0, gens = 0 },
    { name = "if_maoea",   pop = 0, gens = 0 },
    { name = "maoea_iamd", pop = 0, gens = 0 },
    # Reference vectors and angles
    { name = "rvea",       pop = 0, gens = 0 },
    { name = "maoeaarv",   pop = 0, gens = 0 },
    { name = "mbra",       pop = 0, gens = 0 },
    { name = "nrv_moea",   pop = 0, gens = 0 },
    { name = "dea_gng",    pop = 0, gens = 0 },
    { name = "srv",        pop = 0, gens = 0 },
    { name = "srv_nsga3",  pop = 0, gens = 0 },
    # Clustering
    { name = "camoea",     pop = 0, gens = 0 },
    { name = "cava_moea",  pop = 0, gens = 0 },
    { name = "maoea_ac",   pop = 0, gens = 0 },
    { name = "maoea_c",    pop = 0, gens = 0 },
    { name = "maoea_3c",   pop = 0, gens = 0 },
    { name = "emyo_c",     pop = 0, gens = 0 },
    { name = "crea",       pop = 0, gens = 0 },
    { name = "dcea",       pop = 0, gens = 0 },
    { name = "hcca",       pop = 0, gens = 0 },
    { name = "lis_lcs",    pop = 0, gens = 0 },
    { name = "clia",       pop = 0, gens = 0 },
    # Archives
    { name = "two_arch2",  pop = 0, gens = 0 },
    { name = "naemo",      pop = 0, gens = 0 },
]

[run]
name = "all58"

[problem]
kind = "builtin"

[benchmarks]
runs = 5
problems = [
    # 2 objectives: convex, concave, disconnected, multimodal, biased
    "ZDT1", "ZDT2", "ZDT3", "ZDT4", "ZDT6",

    # 3 objectives
    "DTLZ1_3D", "DTLZ2_3D", "DTLZ3_3D", "DTLZ4_3D", "DTLZ5_3D", "DTLZ6_3D", "DTLZ7_3D",
    "WFG1_3D", "WFG2_3D", "WFG3_3D", "WFG4_3D", "WFG5_3D", "WFG6_3D", "WFG7_3D", "WFG8_3D", "WFG9_3D",
    "IDTLZ1_3D", "IDTLZ2_3D",     # inverted fronts: hard on weight-vector methods
    "SDTLZ1_3D", "SDTLZ2_3D",     # objectives scaled apart: who copes with incommensurate axes

    # 5 objectives
    "DTLZ1_5D", "DTLZ2_5D", "DTLZ3_5D", "DTLZ4_5D", "DTLZ5_5D", "DTLZ6_5D", "DTLZ7_5D",
    "WFG1_5D", "WFG2_5D", "WFG3_5D", "WFG4_5D", "WFG5_5D", "WFG6_5D", "WFG7_5D", "WFG8_5D", "WFG9_5D",
    "IDTLZ1_5D", "IDTLZ2_5D",
    "SDTLZ1_5D", "SDTLZ2_5D",

    # DTLZ1-4 with every distance variable's optimum moved off the centre of
    # the box: the same fronts as DTLZ1-4 above, so an algorithm that does much
    # better there than here was helped by the centred optimum, not by its
    # search. Last in the list, so the job numbers above stay as they were.
    "shiftDTLZ1_3D", "shiftDTLZ2_3D", "shiftDTLZ3_3D", "shiftDTLZ4_3D",
    "shiftDTLZ1_5D", "shiftDTLZ2_5D", "shiftDTLZ3_5D", "shiftDTLZ4_5D",

    # ZCAT1-20. The one suite here where the front and the Pareto set are
    # chosen independently of each other, so these separate "can it find the
    # front" from "can it follow the set through a complicated topology" —
    # every other problem above pairs one front with one fixed set. The four
    # groups are ZCAT1-10 connected and non-degenerate, ZCAT11-13 disconnected,
    # ZCAT14-16 degenerate, ZCAT17-20 part degenerate and part not. Registered
    # with the paper's defaults, so Level 1 and no bias or imbalance: the
    # difficulty dials are left at their easiest and the suite is still hard.
    # Appended, so the job numbers above stay as they were.
    "ZCAT1_3D", "ZCAT2_3D", "ZCAT3_3D", "ZCAT4_3D", "ZCAT5_3D",
    "ZCAT6_3D", "ZCAT7_3D", "ZCAT8_3D", "ZCAT9_3D", "ZCAT10_3D",
    "ZCAT11_3D", "ZCAT12_3D", "ZCAT13_3D", "ZCAT14_3D", "ZCAT15_3D",
    "ZCAT16_3D", "ZCAT17_3D", "ZCAT18_3D", "ZCAT19_3D", "ZCAT20_3D",
    "ZCAT1_5D", "ZCAT2_5D", "ZCAT3_5D", "ZCAT4_5D", "ZCAT5_5D",
    "ZCAT6_5D", "ZCAT7_5D", "ZCAT8_5D", "ZCAT9_5D", "ZCAT10_5D",
    "ZCAT11_5D", "ZCAT12_5D", "ZCAT13_5D", "ZCAT14_5D", "ZCAT15_5D",
    "ZCAT16_5D", "ZCAT17_5D", "ZCAT18_5D", "ZCAT19_5D", "ZCAT20_5D",
]
# DTLZ5, DTLZ6 (from 4 objectives) and WFG3 (from 3) have true fronts with a
# non-degenerate part that their reference sets leave out, so IGD on them ranks
# the algorithms against each other but does not compare with published numbers;
# a warning says so at run time. SDTLZ's IGD is taken in its scaled units, so the
# widest objective dominates it; see "If your objectives are not commensurate"
# in docs/algorithms.md.

[campaign]
out           = "results/{name}"   # relative to this file
budget_fe     = 10000              # 0 = each problem's own pop x 500 generations
record_every  = 10                 # a trajectory point every 10 generations, for Explore
# Along the trajectory only the cheap indicators: exact hypervolume at 5
# objectives takes two to three seconds per call, and recorded every 10
# generations it would be most of the run time. On the final population, once
# per run, the two hypervolumes add up to about 8 CPU-hours to the campaign.
metrics       = ["igd", "igdp"]
final_metrics = ["igd", "igdp", "igdp_norm", "eps", "hv", "hv_h"]
n_ref         = 1000
