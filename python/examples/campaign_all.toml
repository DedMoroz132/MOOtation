    "bbobbiobj41_n05_2D", "bbobbiobj42_n05_2D", "bbobbiobj43_n05_2D", "bbobbiobj44_n05_2D", "bbobbiobj45_n05_2D",
    "bbobbiobj46_n05_2D", "bbobbiobj47_n05_2D", "bbobbiobj48_n05_2D", "bbobbiobj49_n05_2D", "bbobbiobj50_n05_2D",
    "bbobbiobj51_n05_2D", "bbobbiobj52_n05_2D", "bbobbiobj53_n05_2D", "bbobbiobj54_n05_2D", "bbobbiobj55_n05_2D",
    "bbobbiobj01_n10_2D", "bbobbiobj02_n10_2D", "bbobbiobj03_n10_2D", "bbobbiobj04_n10_2D", "bbobbiobj05_n10_2D",
