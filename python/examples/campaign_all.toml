# All 58 algorithms, two blind-sampling baselines and two ablations, on a
# spread of problem shapes: which one is good where.
#
#   python -m mootation.run.campaign campaign_all.toml --list > jobs.txt   # 62 930 jobs
#   python -m mootation.run.campaign campaign_all.toml --workers 16        # one per core
#   python -m mootation.run.campaign campaign_all.toml --ranks igd         # the condensed answer
#   python -m mootation.run --tui campaign_all.toml                        # Campaign / Compare / Explore
#
# Split across machines: run `--shard i/n` on machine i (i = 0 .. n-1), then copy
# every machine's results/all58 into one tree; Compare, --compare and --ranks
# read whatever meta.json files are under it. A killed run resumes when started
# again. docs/running.md, "All 58 algorithms on another machine", has the recipe.
#
# ── What it costs ───────────────────────────────────────────────────────────
# Measured with one seed at 5 000 evaluations, six jobs at a time on an
# 8-thread desktop. The benchmark is evaluated in Python, which is most of the
# time for the cheaper algorithms.
#
#   all 58 on one 2-objective problem     23 s   (ZDT1)
#   all 58 on one 3-objective problem     92 s   (DTLZ2_3D; HypE 38 s of it)
#   all 58 on one 5-objective problem    545 s   (DTLZ2_5D; SMS-M2M 312 s,
#                                                 R2-IBEA 99 s, HypE 46 s)
#
# Time grows about in proportion to the budget. As shipped — 5 runs at 10 000
# evaluations — the whole campaign is about 105 CPU-hours: 90 scaled from the
# measurements above, an estimated 10 for what every run now records besides
# (the archive, some 20-50 us per evaluation, and the hypervolume on the
# trajectories, ~15 ms a point with the compiled extension), and about 5 for
# the four baselines, which cost what NSGA-II does: the benchmark's evaluation
# in Python is most of their time. That is about 7 hours on 16 cores, 13 on 8. SMS-M2M alone is
# about half of it, R2-IBEA a sixth and HypE an eighth; commenting out those
# three leaves about 30 CPU-hours. Two presets:
#
#   first look      runs = 5,  budget_fe = 10000   as shipped
#   paper budgets   runs = 21, budget_fe = 0       500 generations each; about
#                                                  2 300 CPU-hours, so shard it
#
# WHERE THE TIME GOES, since the problem count no longer predicts it. The
# objective count does: one 5-objective problem costs about as much as twenty
# 2-objective ones.
#   * the 40 ZCAT problems are roughly half the campaign, nearly all of it the
#     twenty at five objectives, so commenting out the ZCAT*_5D block takes
#     about 40 CPU-hours off;
#   * the 110 bbob-biobj problems are the majority of the problem list and only
#     about an eighth of the time, because they have two objectives.
# Neither suite's evaluation cost is what matters. ZCAT's is about 3x DTLZ2's
# (measured, 71 us against 25 at three objectives and 92 against 33 at five)
# and bbob-biobj's runs from 5 us for a pair of spheres to 114 us for a pair of
# Gallagher 101-peak functions; at 10 000 evaluations that is about a second of
# a job either way, and the algorithm is the rest.

# The list comes first because TOML allows top-level keys only before the first
# [table]. Comment a line out to drop an algorithm. pop = 0 and gens = 0 take
# each problem's own defaults, rounded to a size the algorithm accepts (the
# rounding is noted in each run's meta.json); parameters are the papers'.
algorithms = [
    # Pareto dominance and diversity
    { name = "nsga2",      pop = 0, gens = 0 },
    { name = "spea2",      pop = 0, gens = 0 },
    { name = "spea2_sde",  pop = 0, gens = 0 },
