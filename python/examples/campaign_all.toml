    "bbobbiobj26_n05_2D", "bbobbiobj27_n05_2D", "bbobbiobj28_n05_2D", "bbobbiobj29_n05_2D", "bbobbiobj30_n05_2D",
    "bbobbiobj31_n05_2D", "bbobbiobj32_n05_2D", "bbobbiobj33_n05_2D", "bbobbiobj34_n05_2D", "bbobbiobj35_n05_2D",
