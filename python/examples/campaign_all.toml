    "bbobbiobj46_n10_2D", "bbobbiobj47_n10_2D", "bbobbiobj48_n10_2D", "bbobbiobj49_n10_2D", "bbobbiobj50_n10_2D",
    "bbobbiobj51_n10_2D", "bbobbiobj52_n10_2D", "bbobbiobj53_n10_2D", "bbobbiobj54_n10_2D", "bbobbiobj55_n10_2D",
