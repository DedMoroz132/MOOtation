# DTLZ5_5D, DTLZ6_5D, WFG3_3D and WFG3_5D are scored against their FULL fronts,
# non-degenerate part included (mootation.benchmarks.fronts_full). The DTLZ5/6
# ones reach the bound of g, so their nadir reaches about 3.4 and 11 where the
# curve never exceeded 1: runs scored against the old curve do not compare.
# SDTLZ's IGD is taken in its scaled units, so the widest objective dominates
# it; see "If your objectives are not commensurate" in docs/algorithms.md.

[campaign]
out           = "results/{name}"   # relative to this file
budget_fe     = 10000              # 0 = each problem's own pop x 500 generations
# Trajectory points at fixed evaluation counts, 10 per decade (100, 126, 158,
# ...): the SAME counts at 10 000, 25 000 and 50 000 evaluations, so the budget
# ladder lines up point by point. About 20 points per run up to 10 000.
record_grid       = "log"
record_per_decade = 10
# The hypervolume on the trajectory: exact up to three objectives, and at five
# a Monte-Carlo estimate from 10 000 points (about +-0.01 at 95 %; the same
# points at every record, so the curve does not jitter). On the final
# population, once per run, both hypervolumes are exact up to five objectives
# (the compiled WFG, ~20 ms) and Monte Carlo above.
trajectory_hv_max_m = 3
trajectory_hv_mc_samples = 10000
metrics       = ["igd", "igdp", "igdp_norm", "gdp", "eps", "eps_norm", "hv_h",
                 "range_cover", "nd_share", "dup_share"]
# igdx and cr where the problem has a Pareto-set sample (DTLZ1-4, shiftDTLZ1-4,
# ZCAT; null elsewhere), pdist everywhere: the decision space.
final_metrics = ["igd", "igdp", "igdp_norm", "gdp", "eps", "eps_norm", "hv", "hv_h",
                 "roi_dist", "range_cover", "nd_share", "dup_share",
                 "igdx", "cr", "pdist"]
n_ref         = 1000
# Every run also writes archive.csv, its nondominated points (archive = true is
# the default). Population snapshots cost disk — on the order of gigabytes for
# the whole campaign at 25 000 evaluations — so they are off here; switch them
# on for a few problems with  snapshots = ["DTLZ2_3D", "WFG4_5D"].
