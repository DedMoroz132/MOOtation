    "bbobbiobj26_n10_2D", "bbobbiobj27_n10_2D", "bbobbiobj28_n10_2D", "bbobbiobj29_n10_2D", "bbobbiobj30_n10_2D",
    "bbobbiobj31_n10_2D", "bbobbiobj32_n10_2D", "bbobbiobj33_n10_2D", "bbobbiobj34_n10_2D", "bbobbiobj35_n10_2D",
