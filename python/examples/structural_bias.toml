    { name = "random_selection_ea", pop = 0, gens = 0 },
    { name = "gsemo",               pop = 0, gens = 0 },
]

[run]
name = "structural_bias"

[problem]
kind = "builtin"

[benchmarks]
runs = 30
problems = ["uninformative_n02_2D", "uninformative_n10_2D",
            "uninformative_f2b_n02_2D", "uninformative_f2b_n10_2D",
            "uninformative_f3b_n02_2D", "uninformative_f3b_n10_2D",
            "uninformative_f4b_n02_2D", "uninformative_f4b_n10_2D"]

[campaign]
out           = "results/{name}"
budget_fe     = 30000
record_grid   = "log"
metrics       = ["nd_share"]
final_metrics = ["nd_share", "n_final"]
# Nothing to archive: the answer here is where the points are, and the
# problem counts every evaluated and every non-dominated one itself
# (meta.json, structural_bias).
archive       = false
