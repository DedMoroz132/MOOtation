# Structural bias: where does each algorithm put its population when the
# objectives say nothing? (Task 2 of 2026-09-23, A3.)
#
# On the two uninformative problems every objective value is a U(0, 1) draw
# that does not depend on x (benchmarks/uninformative.py), so no region of the
# box is better than another and any preference the final populations show —
# piled at the bounds, drawn to the centre — is the algorithm's, and it will
# carry it onto every other problem. Thirty seeds at 10 000 evaluations, in
# two and ten variables:
#
#   python -m mootation.run.campaign structural_bias.toml --workers 16
#   python -m mootation.run.campaign structural_bias.toml --bias
#
# About 3 800 jobs of a few seconds each: roughly an hour on 16 cores. The
# report gives, per problem and algorithm, a chi-square against uniform over
# ten bins per variable and the shares of coordinates within 10 % of a bound
# and in the central 20 % (0.2 each when uniform). The method simplifies
# Kudela, van Stein, Bäck & Kononova (GECCO 2026), who ran 120 PlatEMO
# algorithms on five such problems through the BIAS toolbox.
#
# The algorithm list is campaign_all's, plus DMS (added after campaign_all's
# all58 runs); keep the two in step otherwise.

algorithms = [
    # Pareto dominance and diversity
    { name = "nsga2",      pop = 0, gens = 0 },
    { name = "spea2",      pop = 0, gens = 0 },
    { name = "spea2_sde",  pop = 0, gens = 0 },
    { name = "grea",       pop = 0, gens = 0 },
    { name = "vaea",       pop = 0, gens = 0 },
    { name = "agemoea",    pop = 0, gens = 0 },
    { name = "etea",       pop = 0, gens = 0 },
    # Reference points (NSGA-III family)
    { name = "nsga3",      pop = 0, gens = 0 },
    { name = "a_nsga3",    pop = 0, gens = 0 },
    { name = "theta_dea",  pop = 0, gens = 0 },
    { name = "ar_moea",    pop = 0, gens = 0 },
    # Decomposition and region division (MOEA/D family)
    { name = "moead",      pop = 0, gens = 0 },
    { name = "moead_de",   pop = 0, gens = 0 },
    { name = "moead_dra",  pop = 0, gens = 0 },
