[run]
name = "structural_bias"

[problem]
kind = "builtin"

[benchmarks]
runs = 30
problems = ["uninformative_n02_2D", "uninformative_n10_2D"]

[campaign]
out           = "results/{name}"
budget_fe     = 10000
record_grid   = "log"
metrics       = ["nd_share"]
final_metrics = ["nd_share", "n_final"]
# Nothing to archive: the answer here is where the population is.
archive       = false
