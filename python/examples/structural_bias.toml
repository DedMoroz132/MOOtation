# Structural bias: where does each algorithm search when the objectives say
# nothing? (Task 2 of 2026-09-23, A3; task 6 of 2026-10-09, item 11.)
#
# On the uninformative problems every objective value is a random draw that
# does not depend on x (benchmarks/uninformative.py), so no region of the box is
# better than another and any preference — points piled at the bounds, drawn
# to the centre — is the algorithm's, and it will carry it onto every other
# problem. The problems are Kudela, van Stein, Bäck & Kononova's (GECCO 2026,
# Table 1): f1 [U, U] and, in their variant beta, f2b (a disconnected front),
# f3b (convex stairs) and f4b (two concave regions), in two and ten variables,
# at their settings (Section 3.4: population 100, 300 iterations, 30 000
# evaluations; 30 seeds here, 100 there). f5, where every point is
# non-dominated, has a file of its own: structural_bias_f5.toml.
#
#   python -m mootation.run.campaign structural_bias.toml --workers 16
#   python -m mootation.run.campaign structural_bias.toml --bias
#
# --bias gives, per problem and algorithm, Kudela et al.'s binsizes over 20
# bins (the two outer and the two middle ones, 1 = no bias) for the final
# populations, the points non-dominated over each run and every point
# evaluated, the shares of coordinates exactly on a bound and exactly at 1/2,
# a chi-squared test on one point per run, the Clark-Evans index at two
# variables, and a class (docs/running.md, "--bias").
#
# The algorithm list is campaign_all's, plus DMS, GDE3, SMS-EMOA, MO-CMA-ES
# and RVEA* (added after campaign_all's all58 runs); keep the two in step
# otherwise, and this file and structural_bias_f5.toml.

algorithms = [
    # Pareto dominance and diversity
    { name = "nsga2",      pop = 0, gens = 0 },
    { name = "spea2",      pop = 0, gens = 0 },
    { name = "spea2_sde",  pop = 0, gens = 0 },
    { name = "grea",       pop = 0, gens = 0 },
    { name = "vaea",       pop = 0, gens = 0 },
