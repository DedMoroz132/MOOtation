# SPDX-License-Identifier: Apache-2.0
#
# Running the standard suites instead of an external solver.
#
#   python -m mootation.run --show --check python/examples/bench.toml
#
# `--check` resolves the family/objective cross product against the real
# registry and names anything that does not exist. Note the naming: the
# problems are DTLZ2_3D, not DTLZ2_M3 — a plausible-looking name that is not
# in the registry is exactly what this catches.

[run]
name    = "suite"
scratch = "scratch/worker_{worker:02d}"
ledger  = "results/{name}/evaluations.jsonl"
workers = 8
resume  = true

[problem]
kind = "builtin"          # objectives come from the built-in suites

[benchmarks]
families   = ["DTLZ", "WFG"]
objectives = [3, 5, 10]   # sizes that actually exist for both families;
                          # --check names the available ones if you miss
runs       = 31           # seeds per problem. NOTE: a signed-rank test is run
                          # over PROBLEMS, not seeds, and its smallest possible
                          # two-sided p is 2^(1-n) in the number of problems:
                          # with 5 problems p < 0.05 is unreachable even if one
                          # method wins every one. Seeds buy a stable median per
                          # problem, not significance.

# ... or name them outright:
# problems = ["DTLZ2_3D", "WFG4_5D", "MaF3_8D"]

# NOTE: an algorithm with an exact-lattice population (nsga3, moead_de,
# theta_dea, ...) needs a pop that is a Das-Dennis size for EVERY objective
# count in the sweep, and no single number is one at M = 3, 5 and 10 at once
# (91 is a lattice size at M = 3 only). `--check` refuses such a config and
# names the attainable sizes; uncomment the block below to see it. Run one
# config per objective count for those, or use algorithms without the
# constraint, as this file does.
#
# [[algorithms]]
# name   = "moead_de"
# pop    = 91             # a lattice size for 3 objectives only
# gens   = 500
# params = { T = 20, delta = 0.9 }

[[algorithms]]
name = "nsga2"
pop  = 100
gens = 500

[[algorithms]]
name = "spea2"
pop  = 100
gens = 500
