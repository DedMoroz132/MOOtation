[run]
name = "structural_bias_f5"

[problem]
kind = "builtin"

[benchmarks]
runs = 10
problems = ["uninformative_f5_n02_2D", "uninformative_f5_n10_2D"]

[campaign]
out           = "results/{name}"
budget_fe     = 30000
record_grid   = "log"
metrics       = ["nd_share"]
final_metrics = ["nd_share", "n_final"]
# Nothing to archive: the answer here is where the points are, and the
# problem counts every evaluated and every non-dominated one itself
# (meta.json, structural_bias).
archive       = false
