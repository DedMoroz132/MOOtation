# Structural bias on f5 (task 6 of 2026-10-09, item 11): Kudela et al.'s
# problem whose two objectives are perfectly opposed, [a, -a] with a = U(0, 1)
# drawn fresh at every evaluation, so that every point is non-dominated. The
# rest is structural_bias.toml's, with two exceptions for the cost: every
# algorithm that keeps its non-dominated points truncates them at every
# evaluation here, and DMS, whose list of non-dominated points grows with every
# evaluation, takes over ten minutes a run at 30 000 evaluations (3 s at 5 000,
# 25 s at 10 000, measured 2026-10-07): ten seeds instead of thirty, and DMS at
# 10 000 evaluations.
#
#   python -m mootation.run.campaign structural_bias_f5.toml --workers 16
#   python -m mootation.run.campaign structural_bias_f5.toml --bias

algorithms = [
    # Pareto dominance and diversity
    { name = "nsga2",      pop = 0, gens = 0 },
    { name = "spea2",      pop = 0, gens = 0 },
    { name = "spea2_sde",  pop = 0, gens = 0 },
    { name = "grea",       pop = 0, gens = 0 },
    { name = "vaea",       pop = 0, gens = 0 },
    { name = "agemoea",    pop = 0, gens = 0 },
    { name = "etea",       pop = 0, gens = 0 },
