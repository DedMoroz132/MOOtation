[run]
name = "ablation_bound_repair"

[problem]
kind = "builtin"

[benchmarks]
runs = 10
problems = ["ZDT1", "ZDT4", "DTLZ1_3D", "DTLZ3_3D", "shiftZDT1", "shiftZDT4", "shiftDTLZ1_3D",
            "shiftDTLZ3_3D", "rDTLZ1_3D", "rDTLZ2_3D"]

[campaign]
out            = "results/{name}"
budget_fe      = 25000
record_grid    = "log"
metrics        = ["igdp_norm", "hv"]
final_metrics  = ["igd", "igdp", "igdp_norm", "eps_norm", "hv", "hv_h", "gdp_norm", "gdp_min",
                  "g_min", "g_median", "n_final", "range_cover", "igdx", "pdist"]
operator_stats = true
