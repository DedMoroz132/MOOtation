# Which bound repair, where it matters (task 6 of 2026-10-09, item 13): not
# run yet — a configuration to run when the owner says so.
#
# Every algorithm with the bound_repair knob, at each of its values clip,
# reflect, random, midpoint, resample and wrap ("native", the paper's own rule
# where an algorithm has one, is left out). Two groups:
#   * the 12 whose own operators leave the box (DE, Liu and Li's, the
#     sine-cosine and difference operators): gde3, moead_de, moead_dra,
#     moead_m2m, moead_am2m, liu_gu2011, hlmea, emyo_c, dcea, hcca, lis_lcs,
#     naemo — clip, reflect, random, midpoint and wrap; resample is not
#     available to them (operators/bound_repair.hpp, require_repair);
#   * the 5 that vary by SBX and polynomial mutation, which stay in the box by
#     construction, so that the knob changes nothing there: nsga2, spea2_sde,
#     agemoea, ibea_eplus, sms_emoa with mutation = "gaussian" (as e3), at all
#     six values.
# The problems: ZDT1, ZDT4, DTLZ1_3D, DTLZ3_3D, their shifted copies (the
# optimum off the centre and the bound), and rDTLZ1_3D and rDTLZ2_3D (the
# distance variables rotated, the optimum's projection off both). Operator
# statistics on (oob_share: how often a variable left the box); g_min and
# g_median read every problem's own distance to the Pareto set.
#
#   python -m mootation.run.campaign ablation_bound_repair.toml --list
#   python -m mootation.run.campaign ablation_bound_repair.toml --workers 16
#   python -m mootation.run.campaign ablation_bound_repair.toml --compare igdp_norm
#   python -m mootation.run.campaign ablation_bound_repair.toml --compare oob_share
#
# 90 variants (12 x 5 + 5 x 6) x 10 problems x 10 seeds = 9000 runs of
# 25 000 evaluations.

