# E2 (task 2 of 2026-09-23): is there an optimal mutation step near the
# distance between the pits of g?
#
# The pits sit 0.05 of the range apart on ZDT4 and 0.1 on DTLZ1/3. The
# polynomial mutation (eta = 20) steps further than 0.1 of the range with
# probability 0.11, a gaussian with s = 0.1 with probability 0.32. Here the
# polynomial against gaussians with s = 0.025, 0.05, 0.1, 0.3 and a Cauchy with
# s = 0.05, each with the default bound repair (reflect, provisional).
#
#   python -m mootation.run.campaign e2_mutation_step.toml --workers 16
#   python -m mootation.run.campaign e2_mutation_step.toml --compare igdp_norm
#   python -m mootation.run.campaign e2_mutation_step.toml --compare step_mean
#
# 3 algorithms x 6 mutations x 7 problems x 5 seeds = 630 runs.

algorithms = [
    { name = "nsga2", label = "nsga2_poly", pop = 0, gens = 0 },
    { name = "nsga2", label = "nsga2_gauss0p025", pop = 0, gens = 0, params = { mutation = "gaussian", mutation_scale = 0.025 } },
    { name = "nsga2", label = "nsga2_gauss0p05", pop = 0, gens = 0, params = { mutation = "gaussian", mutation_scale = 0.05 } },
    { name = "nsga2", label = "nsga2_gauss0p1", pop = 0, gens = 0, params = { mutation = "gaussian", mutation_scale = 0.1 } },
    { name = "nsga2", label = "nsga2_gauss0p3", pop = 0, gens = 0, params = { mutation = "gaussian", mutation_scale = 0.3 } },
    { name = "nsga2", label = "nsga2_cauchy", pop = 0, gens = 0, params = { mutation = "cauchy" } },
    { name = "ibea_eplus", label = "ibea_eplus_poly", pop = 0, gens = 0 },
    { name = "ibea_eplus", label = "ibea_eplus_gauss0p025", pop = 0, gens = 0, params = { mutation = "gaussian", mutation_scale = 0.025 } },
    { name = "ibea_eplus", label = "ibea_eplus_gauss0p05", pop = 0, gens = 0, params = { mutation = "gaussian", mutation_scale = 0.05 } },
    { name = "ibea_eplus", label = "ibea_eplus_gauss0p1", pop = 0, gens = 0, params = { mutation = "gaussian", mutation_scale = 0.1 } },
    { name = "ibea_eplus", label = "ibea_eplus_gauss0p3", pop = 0, gens = 0, params = { mutation = "gaussian", mutation_scale = 0.3 } },
    { name = "ibea_eplus", label = "ibea_eplus_cauchy", pop = 0, gens = 0, params = { mutation = "cauchy" } },
    { name = "spea2_sde", label = "spea2_sde_poly", pop = 0, gens = 0 },
    { name = "spea2_sde", label = "spea2_sde_gauss0p025", pop = 0, gens = 0, params = { mutation = "gaussian", mutation_scale = 0.025 } },
    { name = "spea2_sde", label = "spea2_sde_gauss0p05", pop = 0, gens = 0, params = { mutation = "gaussian", mutation_scale = 0.05 } },
    { name = "spea2_sde", label = "spea2_sde_gauss0p1", pop = 0, gens = 0, params = { mutation = "gaussian", mutation_scale = 0.1 } },
    { name = "spea2_sde", label = "spea2_sde_gauss0p3", pop = 0, gens = 0, params = { mutation = "gaussian", mutation_scale = 0.3 } },
    { name = "spea2_sde", label = "spea2_sde_cauchy", pop = 0, gens = 0, params = { mutation = "cauchy" } },
]

[run]
name = "e2_mutation_step"

[problem]
kind = "builtin"

[benchmarks]
runs = 5
problems = ["DTLZ1_3D", "DTLZ3_3D", "shiftDTLZ1_3D", "shiftDTLZ3_3D", "ZDT4", "ZDT1", "ZDT6"]

[campaign]
out            = "results/{name}"
budget_fe      = 10000
record_grid    = "log"
metrics        = ["igdp_norm", "hv"]
final_metrics  = ["igd", "igdp", "igdp_norm", "eps_norm", "hv", "hv_h", "tau90", "n_final",
                  "range_cover", "igdx", "pdist"]
operator_stats = true
