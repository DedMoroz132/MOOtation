# E5 (task 2 of 2026-09-23): does invariance to rotating the search space pay
# on our problems?
#
# GDE3's trial is x_r3 + F·(x_r1 − x_r2) entirely at CR = 1, so it is
# rotation-invariant; at CR = 0.5 half the variables stay the parent's, which
# favours problems whose variables can be optimised one at a time. MO-CMA-ES
# adapts a full covariance matrix per individual — invariant to rotation and to
# rescaling — and its paper reports it losing to NSGA-II on the multimodal
# ZDT4, IHR4 and DTLZ1 (Voß, Hansen & Igel 2010, §4.3); SMS-EMOA has the same
# hypervolume selection with SBX and polynomial mutation, so the two together
# separate what the operator is worth from what the selection is. GDE3 at the
# default 0.2/0.2 (its paper's test-problem setting) and NSGA-II are the
# references. F = 0.5 in both CR variants, the usual DE value (the task names
# only CR).
#
# Problems: E1's seven (ZDT1, ZDT4, ZDT6, DTLZ1_3D, DTLZ3_3D and the shifted
# DTLZ1/3, where the optimum is not at the centre of the box) and all 110
# bbob-biobj problems, where most pairs are not separable. bbob-biobj has no
# reference front: rank it by hv (--ranks hv; --by separable splits F1, F2 and
# F11 from the rest, see README.md on E4).
#
#   python -m mootation.run.campaign e5_rotation.toml --workers 16
#   python -m mootation.run.campaign e5_rotation.toml --ranks hv --by separable
#   python -m mootation.run.campaign e5_rotation.toml --compare igdp_norm
#
# 6 algorithms x 117 problems x 5 seeds = 3 510 runs at 10 000 evaluations.
# SMS-EMOA is the slow one: exact hypervolume contributions, about 20 s a run
# at three objectives on a desktop core, a second or two at two.

algorithms = [
    { name = "gde3", label = "gde3_cr1", pop = 0, gens = 0, params = { F = 0.5, CR = 1.0 } },
    { name = "gde3", label = "gde3_cr05", pop = 0, gens = 0, params = { F = 0.5, CR = 0.5 } },
    { name = "gde3", pop = 0, gens = 0 },
    { name = "mo_cma_es", pop = 0, gens = 0 },
    { name = "sms_emoa", pop = 0, gens = 0 },
    { name = "nsga2", pop = 0, gens = 0 },
]

[run]
name = "e5_rotation"

[problem]
kind = "builtin"

