[run]
name = "stage3_probe"

[problem]
kind = "builtin"

[benchmarks]
runs = 2
problems = [
    "ZCAT1_5D", "ZCAT14_5D", "DTLZ3_5D", "DTLZ7_5D",
    "WFG3_3D", "WFG3_5D", "bbobbiobj25_n10_2D", "Polygon_6D",
    "MOP7", "BT9",
]

[campaign]
out                = "results/{name}"   # relative to this file
budget_fe          = 25000
# The trajectory on the logarithmic grid, 10 points a decade, plus the budget
# ladder's rungs exactly (the grid itself has 2 512 and 5 012).
record_grid        = "log"
record_per_decade  = 10
record_at          = [2500, 5000, 10000, 25000]
# The hypervolume on the trajectory: exact up to three objectives, a Monte-Carlo
# estimate from 10 000 points above; the final one exact up to five.
trajectory_hv_max_m      = 3
trajectory_hv_mc_samples = 10000
metrics       = ["igdp_norm", "gdp", "gdp_norm", "eps_norm", "hv_h", "range_cover",
                 "tau90", "gap_max", "nn_cv"]
final_metrics = ["igd", "igdp", "igdp_norm", "gdp", "gdp_norm", "eps", "eps_norm", "hv",
                 "hv_h", "roi_dist", "range_cover", "nd_share", "dup_share", "tau90",
                 "gap_max", "nn_cv", "n_final", "igdx", "cr", "pdist"]
n_ref         = 1000
# Every run keeps its archive and the "archive" scenario: the archive reduced to
# the population size by DSS, almost-dominated points last. The archive keeps
# the objectives of every point (archive.csv.gz) and the variables only of the
# points the scenario selects (final_archive.csv.gz): for the whole stage about
# 8 GiB instead of the 88 of archive.csv.
archive           = true
archive_scenario  = true
archive_variables = "selected"
# The population's objectives at every trajectory record (snapshots.npz,
# float32): about 3 GiB for the whole stage.
snapshots         = true
